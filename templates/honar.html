{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/honar.css') }}">

<div class="glass-layout">
    
    <aside class="sidebar-glass" id="sidebar">
        <div class="sidebar-header-gemini">
            <button class="icon-btn" onclick="toggleSidebar()" title="Menu">
                <i class="fas fa-bars"></i>
            </button>
            <button class="icon-btn" onclick="startNewChatUI()" title="New Chat">
                <i class="far fa-edit"></i>
            </button>
        </div>

        <div class="chat-list-glass custom-scroll">
            {% for chat in chats %}
            <div class="chat-item-glass" id="chat-item-{{ chat.id }}" onclick="loadChat('{{ chat.id }}')">
                <i class="far fa-comment-alt chat-icon"></i>
                <span class="chat-title-text" id="title-{{ chat.id }}">{{ chat.title }}</span>
                
                <div class="chat-options" onclick="toggleMenu(event, '{{ chat.id }}')">
                    <i class="fas fa-ellipsis-v"></i> 
                </div>

                <div class="glass-dropdown" id="menu-{{ chat.id }}">
                    <div class="action-rename" onclick="renameChat(event, '{{ chat.id }}')"><i class="fas fa-pen"></i> Rename</div>
                    <div class="action-delete text-danger" onclick="deleteChat(event, '{{ chat.id }}')"><i class="fas fa-trash"></i> Delete</div>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <div class="sidebar-footer">
            <div class="user-profile-glass">
                <div class="avatar-circle">U</div>
                <div class="user-info">
                    <span class="name">My Workspace</span>
                    <span class="status">Pro Plan</span>
                </div>
            </div>
        </div>
    </aside>

    <main class="main-glass">
        
        <header class="glass-header">
            <button class="burger-btn" id="main-burger" onclick="toggleSidebar()" style="display: none;">
                <i class="fas fa-bars"></i> 
            </button>
            <div class="model-badge">
                Honar AI 
            </div>
        </header>

        <div id="honar-display" class="messages-container custom-scroll">
            <div id="welcome-state" class="empty-state">
                <h2>How can I help you create today?</h2>
            </div>
        </div>

        <div class="input-area-glass">
            <div class="input-wrapper">
                <input type="text" id="honar-input" placeholder="Message Honar..." autocomplete="off">
                <button id="honar-send" onclick="handleSendClick()">
                    <i class="fas fa-arrow-up"></i>
                </button>
            </div>
            <div class="footer-text">Honar can make mistakes. Consider checking important information.</div>
        </div>

    </main>
</div>

<template id="chat-item-template">
    <div class="chat-item-glass">
        <i class="far fa-comment-alt chat-icon"></i>
        <span class="chat-title-text"></span>
        
        <div class="chat-options">
            <i class="fas fa-ellipsis-v"></i>
        </div>

        <div class="glass-dropdown">
            <div class="action-rename"><i class="fas fa-pen"></i> Rename</div>
            <div class="action-delete text-danger"><i class="fas fa-trash"></i> Delete</div>
        </div>
    </div>
</template>

<div id="honarModal" class="custom-modal-overlay">
    <div class="custom-modal-box">
        <h3 id="modal-title">Title</h3>
        <p id="modal-text">Message</p>
        <input type="text" id="modal-input" autocomplete="off" class="form-control">
        <div class="modal-buttons">
            <button id="modal-btn-cancel" class="btn-cancel">Cancel</button>
            <button id="modal-btn-ok" class="btn-ok">OK</button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/honar.js') }}"></script>
{% endblock %}
