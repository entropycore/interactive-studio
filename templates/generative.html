{% extends "base.html" %}

{% block content %}
<style>
    .gen-workspace {
        display: flex; height: calc(100vh - 90px); width: 100%;
        background: var(--bg-input); font-family: 'Segoe UI', sans-serif;
    }
    
    /* 🌟 SIDEBAR (Tools & Generators) 🌟 */
    .controls-sidebar {
        width: 350px; padding: 25px; overflow-y: auto;
        background: var(--bg-glass-sidebar); backdrop-filter: blur(15px);
        border-right: 1px solid var(--border-color);
        display: flex; flex-direction: column; z-index: 10;
    }
    
    .section-title {
        font-size: 1.1rem; font-weight: 700; color: var(--text-main);
        margin: 20px 0 15px 0; padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
        display: flex; align-items: center; gap: 10px;
    }

    /* Form UI */
    .form-group { margin-bottom: 15px; }
    .form-label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: var(--text-muted); }
    .custom-select, .color-picker, .range-slider {
        width: 100%; padding: 10px; border-radius: 8px;
        background: var(--bg-input); border: 1px solid var(--border-color);
        color: var(--text-main); outline: none;
    }
    .color-picker { height: 45px; padding: 5px; cursor: pointer; }

    .btn-action {
        width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 600;
        cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        margin-bottom: 10px;
    }
    .btn-python { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-python:hover { box-shadow: 0 5px 15px rgba(118, 75, 162, 0.4); transform: translateY(-2px); }
    
    .btn-save { background: #0d6efd; color: white; }
    .btn-save:hover { background: #0b5ed7; transform: translateY(-2px); }
    
    .btn-clear { background: transparent; border: 1px solid #dc3545; color: #dc3545; }
    .btn-clear:hover { background: #dc3545; color: white; }

    /* 🌟 CANVAS AREA 🌟 */
    .canvas-display {
        flex: 1; display: flex; align-items: center; justify-content: center;
        background: #0a0a0a; position: relative; overflow: hidden;
    }
    
    .canvas-container {
        position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        border: 1px solid rgba(255,255,255,0.1); border-radius: 4px;
        background: #ffffff; /* Default background */
    }

    #drawing-canvas {
        cursor: crosshair; display: block;
    }

    
    #hidden-form { display: none; }
</style>

<div class="gen-workspace">
    <aside class="controls-sidebar custom-scroll">
        
        <div class="section-title">
            <i class="fas fa-robot text-info"></i> Auto-Generate (Python OOP)
        </div>
        <form method="POST" action="{{ url_for('generative') }}">
            <div class="form-group">
                <label class="form-label">Algorithm Style</label>
                <select name="style" class="custom-select">
                    <option value="chaos">Geometric Chaos</option>
                    <option value="grid">Mondrian Grid</option>
                    <option value="network">Fractal Network</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Color Palette</label>
                <select name="theme" class="custom-select">
                    <option value="cyberpunk">Cyberpunk</option>
                    <option value="vintage">Vintage</option>
                    <option value="nature">Nature</option>
                </select>
            </div>
            <button type="submit" class="btn-action btn-python">
                <i class="fas fa-magic"></i> Generate Art
            </button>
        </form>

        <div class="section-title mt-4">
            <i class="fas fa-paint-brush text-warning"></i> Manual Sketch Pad
        </div>
        <div class="form-group">
            <label class="form-label">Brush Color</label>
            <input type="color" id="brush-color" class="color-picker" value="#000000">
        </div>
        <div class="form-group">
            <label class="form-label">Brush Size</label>
            <input type="range" id="brush-size" class="range-slider" min="1" max="20" value="3">
        </div>
        
        <button class="btn-action btn-save" onclick="saveManualSketch()">
            <i class="fas fa-save"></i> Save Sketch
        </button>
        <button class="btn-action btn-clear" onclick="clearCanvas()">
            <i class="fas fa-eraser"></i> Clear Canvas
        </button>

        {% if saved_image %}
        <div class="mt-4 text-center">
            <span class="badge bg-success"><i class="fas fa-check"></i> Image Saved to Gallery!</span>
        </div>
        {% endif %}

    </aside>

    <main class="canvas-display">
        <div class="canvas-container">
            <canvas id="drawing-canvas" width="800" height="600"></canvas>
        </div>
    </main>
</div>

<form id="hidden-form" method="POST" action="{{ url_for('generative') }}">
    <input type="hidden" name="image_data" id="image_data_input">
</form>

<script>
    // --- 1. Canvas Setup ---
    const canvas = document.getElementById('drawing-canvas');
    const ctx = canvas.getContext('2d');
    
    
    {% if saved_image %}
        const img = new Image();
        img.src = "{{ url_for('static', filename='outputs/' + saved_image) }}";
        img.onload = () => {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
    {% else %}
       
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    {% endif %}

    // --- 2. Manual Drawing Logic (Sketch Pad) ---
    let painting = false;

    function startPosition(e) {
        painting = true;
        draw(e);
    }

    function endPosition() {
        painting = false;
        ctx.beginPath();
    }

    function draw(e) {
        if (!painting) return;
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        ctx.lineWidth = document.getElementById('brush-size').value;
        ctx.lineCap = 'round';
        ctx.strokeStyle = document.getElementById('brush-color').value;

        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', endPosition);
    canvas.addEventListener('mousemove', draw);
    // Support for tablets/phones
    canvas.addEventListener('touchstart', (e) => startPosition(e.touches[0]));
    canvas.addEventListener('touchend', endPosition);
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault(); // prevent scrolling
        draw(e.touches[0]);
    });

    // --- 3. Tools Actions ---
    function clearCanvas() {
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function saveManualSketch() {
        
        const dataURL = canvas.toDataURL('image/png');
       
        document.getElementById('image_data_input').value = dataURL;
        document.getElementById('hidden-form').submit();
    }
</script>
{% endblock %}
