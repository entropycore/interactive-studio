{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    /* Workspace Dashboard Theme Variables */
    :root {
        --dash-card-bg: rgba(255, 255, 255, 0.65);
        --dash-card-border: rgba(255, 255, 255, 0.5);
        --dash-text: #1f2937;
        --dash-text-muted: #6b7280;
        --dash-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        --dash-hover-shadow: 0 15px 40px rgba(13, 110, 253, 0.15);
    }

    body.dark-mode {
        --dash-card-bg: rgba(25, 25, 25, 0.65);
        --dash-card-border: rgba(255, 255, 255, 0.08);
        --dash-text: #f9fafb;
        --dash-text-muted: #9ca3af;
        --dash-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        --dash-hover-shadow: 0 15px 40px rgba(13, 110, 253, 0.25);
    }

    .notes-container {
        max-width: 1200px;
        margin: 120px auto 50px;
        padding: 0 20px;
        animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .notes-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
    }

    .notes-header h1 {
        font-size: 2.8rem;
        font-weight: 800;
        color: var(--dash-text);
        letter-spacing: -0.5px;
    }

    .btn-create {
        background: linear-gradient(135deg, #0d6efd, #3b82f6);
        color: white;
        border: none;
        padding: 14px 28px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-create:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(13, 110, 253, 0.4);
    }

    .notes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 30px;
    }

    .note-card {
        background: var(--dash-card-bg);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--dash-card-border);
        border-radius: 24px;
        padding: 30px;
        box-shadow: var(--dash-shadow);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 200px;
        position: relative;
        overflow: hidden;
    }

    .note-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 4px;
        background: linear-gradient(90deg, #0d6efd, #ec4899);
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .note-card:hover {
        transform: translateY(-8px);
        box-shadow: var(--dash-hover-shadow);
        border-color: rgba(13, 110, 253, 0.3);
    }

    .note-card:hover::before { opacity: 1; }

    .note-title {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--dash-text);
        margin-bottom: 12px;
        line-height: 1.3;
    }

    .note-date {
        font-size: 0.9rem;
        color: var(--dash-text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .note-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid var(--dash-card-border);
    }

    .btn-open {
        color: #0d6efd;
        text-decoration: none;
        font-weight: 600;
        display: flex; 
        align-items: center; 
        gap: 8px;
        transition: gap 0.2s;
    }
    
    .btn-open:hover { gap: 12px; }

    .btn-delete {
        background: rgba(239, 68, 68, 0.1);
        border: none;
        color: #ef4444;
        width: 35px; height: 35px;
        border-radius: 50%;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s ease;
    }

    .btn-delete:hover {
        background: #ef4444;
        color: white;
        transform: scale(1.1) rotate(5deg);
    }

    .empty-state {
        text-align: center;
        grid-column: 1 / -1;
        padding: 80px 20px;
        color: var(--dash-text-muted);
        background: var(--dash-card-bg);
        border-radius: 24px;
        border: 1px dashed var(--dash-card-border);
    }
    
    .empty-state i {
        font-size: 4rem;
        opacity: 0.5;
        margin-bottom: 20px;
        background: linear-gradient(135deg, #0d6efd, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
</style>

<div class="notes-container">
    <div class="notes-header">
        <h1>Workspaces</h1>
        <button class="btn-create" onclick="createNewNote()">
            <i class="fas fa-plus"></i> New Canvas
        </button>
    </div>

    <div class="notes-grid">
        {% if notes and notes|length > 0 %}
            {% for note in notes %}
            <div class="note-card" id="card-{{ note.id }}">
                <div>
                    <div class="note-title">{{ note.title }}</div>
                    <div class="note-date">
                        <i class="far fa-clock"></i> 
                        <span class="formatted-date" data-date="{{ note.updated_at }}"></span>
                    </div>
                </div>
                <div class="note-actions">
                    <a href="/editor/{{ note.id }}" class="btn-open">Open Studio <i class="fas fa-arrow-right"></i></a>
                    <button class="btn-delete" onclick="deleteNote('{{ note.id }}')" title="Delete Workspace">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div class="empty-state">
                <i class="fas fa-drafting-compass"></i>
                <h2>No canvases yet</h2>
                <p style="margin-top: 10px;">Create your first interactive workspace to start designing.</p>
            </div>
        {% endif %}
    </div>
</div>

<script>
    // Format dates cleanly on the client side
    document.querySelectorAll('.formatted-date').forEach(el => {
        const dateStr = el.getAttribute('data-date');
        if(dateStr) {
            const date = new Date(dateStr);
            el.innerText = date.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
        }
    });

    function createNewNote() {
        const title = prompt("Name your new workspace:", "Untitled Canvas");
        if (!title) return;
        
        fetch('/api/notes/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: title })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) window.location.href = `/editor/${data.note_id}`;
        })
        .catch(err => console.error("Creation failed:", err));
    }

    function deleteNote(id) {
        if(confirm("Delete this workspace permanently?")) {
            fetch(`/api/notes/delete/${id}`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    const card = document.getElementById(`card-${id}`);
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.9)';
                    setTimeout(() => card.remove(), 300);
                }
            });
        }
    }
</script>
{% endblock %}
